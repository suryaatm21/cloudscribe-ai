# Cloud Build configuration for web-client
# Triggered automatically when you push to GitHub

steps:
  # Step 1: Build the Docker image for linux/amd64
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform=linux/amd64"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/yt-web-client-repo/yt-web-client:$COMMIT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/yt-web-client-repo/yt-web-client:latest"
      - "."
    dir: "yt-web-client"

  # Step 2: Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/yt-web-client-repo/yt-web-client:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/yt-web-client-repo/yt-web-client:latest"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "cloudscribe-ai"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/yt-web-client-repo/yt-web-client:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"

# Default e2-standard-2 (2 vCPU) is slower than the previous N1_HIGHCPU_8
# (measured 6m15s). Allow 30 minutes so a Next.js production build cannot
# fail on time. Default machine also qualifies for 2,500 free e2-standard-2
# build-minutes/month.
timeout: "1800s"

# CLOUD_LOGGING_ONLY is required when there is no dedicated logs bucket.
options:
  logging: CLOUD_LOGGING_ONLY
