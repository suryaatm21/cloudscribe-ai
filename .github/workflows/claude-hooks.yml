# Tests the Claude Code hooks in .claude/hooks. The tests feed tool-call JSON
# to each hook and never execute gcloud or touch Google Cloud.
name: Claude hooks

on:
  pull_request:
    paths:
      - ".claude/**"
      - ".github/workflows/claude-hooks.yml"
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - ".github/workflows/claude-hooks.yml"

permissions:
  contents: read

jobs:
  hook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: python3 -m unittest discover -s .claude/hooks -p "test_*.py" -v
