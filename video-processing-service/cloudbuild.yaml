# Cloud Build configuration for video-processing-service
# Triggered automatically when you push to GitHub
#
# Manual `gcloud builds submit` must pass
# `--substitutions=COMMIT_SHA="$(git rev-parse HEAD)"`. COMMIT_SHA is only
# auto-populated for trigger builds; without it the image tag is an invalid
# empty `...:` suffix.

steps:
  # Step 0: Install dependencies, build, and run tests before building the Docker image
  - name: "gcr.io/cloud-builders/npm"
    dir: "video-processing-service"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npm install
        npm run build
        npm test

  # Step 1: Build the Docker image for linux/amd64
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform=linux/amd64"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:$COMMIT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:latest"
      - "."
    dir: "video-processing-service"

  # Step 2: Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:latest"

  # Step 3: Deploy to Cloud Run
  # Substitutions are expanded by Cloud Build in args, not exported into the step's
  # shell, so bash defaults like ${COMMIT_SHA:-unknown} resolve to "unknown" and
  # deploy a tag that was never pushed. Reference $COMMIT_SHA directly instead.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "video-processing-service"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--timeout=3600"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--ingress=internal"
      # _ENABLE_TRANSCRIPTION is a Cloud Build substitution so the deployed
      # value is explicit and deterministic, but the GitHub trigger (or a
      # manual `gcloud builds submit --substitutions`) can flip it to true
      # after infra is provisioned without changing this file. Hardcoding
      # false here would silently disable transcription on every merge to main.
      # Bucket/topic names are substitutions so the deployed worker matches
      # what `scripts/setup-transcription-infra.sh` provisioned, instead of
      # relying on `config.ts` defaults drifting from live infra.
      - "--update-env-vars=PROCESSING_MAX_ATTEMPTS=3,ENABLE_TRANSCRIPTION=${_ENABLE_TRANSCRIPTION},SPEECH_PROCESSING_STRATEGY=${_SPEECH_PROCESSING_STRATEGY},TRANSCRIPTS_BUCKET_NAME=${_TRANSCRIPTS_BUCKET_NAME},AUDIO_WORK_BUCKET_NAME=${_AUDIO_WORK_BUCKET_NAME},TRANSCRIPTION_TOPIC_NAME=${_TRANSCRIPTION_TOPIC_NAME},SERVICE_VERSION=$COMMIT_SHA"
      - "--labels=commit=$COMMIT_SHA"

# Default stays off. Infra is provisioned; flip the GitHub trigger
# substitution `_ENABLE_TRANSCRIPTION=true` only when turning transcription
# on. Confirmed trigger: name `video-processing-service`,
# region `global` (`gcloud builds triggers list --project=yt-clone-385f4`).
#
# Live trigger substitutions (2026-08-24, read-only describe):
#   _ENABLE_TRANSCRIPTION: 'true'
#   _SPEECH_PROCESSING_STRATEGY: STANDARD
#   _TRANSCRIPTS_BUCKET_NAME: atmuri-yt-transcripts
#   _AUDIO_WORK_BUCKET_NAME: atmuri-yt-audio-work
#   _TRANSCRIPTION_TOPIC_NAME: transcription-jobs
#
# Do NOT use `--update-substitutions=_ENABLE_TRANSCRIPTION=true` alone — it
# returns INVALID_ARGUMENT on the current SDK/trigger. Export, edit, re-import:
#
#   gcloud builds triggers describe video-processing-service \
#     --region=global --project=yt-clone-385f4 \
#     --format=yaml > /tmp/video-processing-service-trigger.yaml
#   # Edit the substitutions block in the exported file.
#   gcloud builds triggers update github video-processing-service \
#     --region=global --project=yt-clone-385f4 \
#     --trigger-config=/tmp/video-processing-service-trigger.yaml
#
# To flip transcription on, set `_ENABLE_TRANSCRIPTION: 'true'` in that file
# (keep the other substitution keys unchanged unless intentionally changing them).
# LAUNCH BLOCKER: `_SPEECH_PROCESSING_STRATEGY` defaults to STANDARD (fast,
# ~$0.016/min, 5× DYNAMIC_BATCHING). Before production lecture audio, set
# `_SPEECH_PROCESSING_STRATEGY=DYNAMIC_BATCHING` on the same trigger.
substitutions:
  _ENABLE_TRANSCRIPTION: "false"
  _SPEECH_PROCESSING_STRATEGY: "STANDARD"
  _TRANSCRIPTS_BUCKET_NAME: "atmuri-yt-transcripts"
  _AUDIO_WORK_BUCKET_NAME: "atmuri-yt-audio-work"
  _TRANSCRIPTION_TOPIC_NAME: "transcription-jobs"

# Build timeout sized for E2_STANDARD_2 (2 vCPU). The prior 600s budget
# matched N1_HIGHCPU_8 (~4m last success); 2 vCPU can take ~3-4x longer.
timeout: "1200s"

# Options
options:
  machineType: "E2_STANDARD_2"
  logging: CLOUD_LOGGING_ONLY
