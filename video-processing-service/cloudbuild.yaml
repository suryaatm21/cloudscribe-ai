# Cloud Build configuration for video-processing-service
# Triggered automatically when you push to GitHub
#
# Manual `gcloud builds submit` must pass
# `--substitutions=COMMIT_SHA="$(git rev-parse HEAD)"`. COMMIT_SHA is only
# auto-populated for trigger builds; without it the image tag is an invalid
# empty `...:` suffix.

steps:
  # Step 0: Install dependencies, build, and run tests before building the Docker image
  - name: "gcr.io/cloud-builders/npm"
    dir: "video-processing-service"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npm install
        npm run build
        npm test

  # Step 1: Build the Docker image for linux/amd64
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform=linux/amd64"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:$COMMIT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:latest"
      - "."
    dir: "video-processing-service"

  # Step 2: Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:latest"

  # Step 3: Deploy to Cloud Run
  # Substitutions are expanded by Cloud Build in args, not exported into the step's
  # shell, so bash defaults like ${COMMIT_SHA:-unknown} resolve to "unknown" and
  # deploy a tag that was never pushed. Reference $COMMIT_SHA directly instead.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "video-processing-service"
      - "--image=us-central1-docker.pkg.dev/$PROJECT_ID/video-processing-service/video-processing-service:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--timeout=3600"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--ingress=internal"
      # _ENABLE_TRANSCRIPTION is a Cloud Build substitution so the deployed
      # value is explicit and deterministic, but the GitHub trigger (or a
      # manual `gcloud builds submit --substitutions`) can flip it to true
      # after infra is provisioned without changing this file. Hardcoding
      # false here would silently disable transcription on every merge to main.
      - "--update-env-vars=PROCESSING_MAX_ATTEMPTS=3,ENABLE_TRANSCRIPTION=${_ENABLE_TRANSCRIPTION},SERVICE_VERSION=$COMMIT_SHA"
      - "--labels=commit=$COMMIT_SHA"

# Default stays off until transcription infra is provisioned. After that, set
# the GitHub trigger substitution `_ENABLE_TRANSCRIPTION=true` so later deploys
# keep the flag on. Confirmed trigger: name `video-processing-service`,
# region `global` (`gcloud builds triggers list --project=yt-clone-385f4`):
#   gcloud builds triggers update github video-processing-service \
#     --region=global --project=yt-clone-385f4 \
#     --update-substitutions=_ENABLE_TRANSCRIPTION=true
substitutions:
  _ENABLE_TRANSCRIPTION: "false"

# Build timeout sized for E2_STANDARD_2 (2 vCPU). The prior 600s budget
# matched N1_HIGHCPU_8 (~4m last success); 2 vCPU can take ~3-4x longer.
timeout: "1200s"

# Options
options:
  machineType: "E2_STANDARD_2"
  logging: CLOUD_LOGGING_ONLY
