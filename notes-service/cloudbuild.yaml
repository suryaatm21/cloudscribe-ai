# Cloud Build configuration for notes-service

steps:
  - name: "gcr.io/cloud-builders/npm"
    dir: "notes-service"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npm install
        npm run build
        npm test

  - name: "gcr.io/cloud-builders/docker"
    dir: "notes-service"
    args:
      - "build"
      - "--platform=linux/amd64"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/notes-service/notes-service:$COMMIT_SHA"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/notes-service/notes-service:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/notes-service/notes-service:$COMMIT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/notes-service/notes-service:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run deploy "notes-service" \
          --image="us-central1-docker.pkg.dev/$PROJECT_ID/notes-service/notes-service:${COMMIT_SHA:-unknown}" \
          --region="us-central1" \
          --platform="managed" \
          --timeout=900 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --ingress="internal-and-cloud-load-balancing" \
          --set-env-vars="NOTES_BUCKET_NAME=atmuri-yt-notes,PROMPTS_BUCKET_NAME=atmuri-yt-notes-prompts,VERTEXAI_PROJECT_ID=$PROJECT_ID,VERTEXAI_REGION=us-central1,VERTEXAI_MODEL=gemini-1.5-pro,ENABLE_NOTES=true" \
          --labels="commit=${COMMIT_SHA:-unknown}"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "900s"
